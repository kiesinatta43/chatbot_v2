<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Teaching Assistant for Design & Technology</title>
  <link rel="stylesheet" href="/static/styles.css?v=35">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* === pastel blue page base === */
    body {
      font-family: 'Sarabun', sans-serif;
      font-weight: 300;
      background: #e8f4fd;
      color: #1e3a5f;
    }
    h1 {
      font-family: 'Sarabun', sans-serif;
      font-weight: 600;
    }

    /* ══════════════════════════════════
       หัวข้อใหญ่ — อยู่บนสุดของทุกอัน
    ══════════════════════════════════ */
    .page-title {
      flex-shrink: 0;
      text-align: center;
      padding: .7rem 1rem .8rem;
      margin: .6rem 1rem .4rem;
      border-radius: 20px;
      background: linear-gradient(135deg, #7dd3fc 0%, #93c5fd 40%, #a7f3d0 75%, #fbcfe8 100%);
      box-shadow: 0 4px 20px rgba(125,211,252,.40);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .6rem;
    }
    .page-title::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(circle at 15% 30%, rgba(255,255,255,.35) 0%, transparent 55%),
        radial-gradient(circle at 88% 75%, rgba(253,164,175,.40) 0%, transparent 50%),
        radial-gradient(circle at 50% 110%, rgba(253,224,71,.30) 0%, transparent 50%);
      pointer-events: none;
    }
    .page-title::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 5px;
      background: linear-gradient(90deg, #fde047 0%, #fda4af 25%, #fbcfe8 50%, #93c5fd 75%, #a7f3d0 100%);
      pointer-events: none;
    }
    .title-text {
      position: relative;
      z-index: 1;
    }
    /* ไอคอนตกแต่งหัวข้อ */
    .title-deco {
      position: relative;
      z-index: 1;
      flex-shrink: 0;
      filter: drop-shadow(0 2px 6px rgba(30,58,95,.18));
      animation: title-deco-float 4s ease-in-out infinite;
    }
    .title-deco.td-1 { width: 34px; animation-duration: 4.5s; }
    .title-deco.td-2 { width: 30px; animation-duration: 3.6s; animation-delay: .4s; }
    .title-deco.td-3 { width: 32px; animation-duration: 4.2s; animation-delay: .8s; order: 3; }
    @keyframes title-deco-float {
      0%,100% { transform: translateY(0) rotate(0deg); }
      50%     { transform: translateY(-5px) rotate(6deg); }
    }
    @media (max-width: 600px) {
      .title-deco { display: none; }
    }
    .page-title h1 {
      position: relative;
      font-size: 2.3rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: .01em;
      margin-bottom: .35rem;
      line-height: 1.35;
      text-shadow:
        0 1px 0  rgba(255,255,255,.20),
        0 2px 4px rgba(30,58,95,.25),
        0 4px 12px rgba(30,58,95,.20),
        0 8px 24px rgba(30,58,95,.12);
    }
    .page-title .subtitle {
      position: relative;
      font-size: 1.05rem;
      color: rgba(255,255,255,.95);
      font-weight: 500;
      line-height: 1.6;
      letter-spacing: .01em;
      text-shadow:
        0 1px 3px rgba(30,58,95,.22),
        0 3px 10px rgba(30,58,95,.14);
    }
    /* ปุ่มทำแบบทดสอบ (อยู่ติดกับปุ่มประเมินความพึงพอใจ) */
    .composer-actions .quiz-btn {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      font-size: 1rem;
      font-weight: 500;
      color: #065f46;
      background: linear-gradient(135deg, #ecfdf5 0%, #a7f3d0 100%);
      border: 1.5px solid #6ee7b7;
      border-radius: 12px;
      padding: 0.6rem 1.1rem;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 4px 12px rgba(110,231,183,.32);
      transition: opacity .2s, transform .15s, box-shadow .2s;
    }
    .composer-actions .quiz-btn:hover {
      opacity: .9;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(110,231,183,.42);
    }
    .composer-actions .quiz-btn:active { transform: translateY(0); }

    /* ══════════════════════════════════
       แถวล่าง — ซ้าย: กล่องแชท / ขวา: มาสคอต
    ══════════════════════════════════ */
    .content-row {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      gap: 0;
      overflow: hidden;
      padding: .8rem 1rem 1rem;
    }
    .chat-left {
      order: 2;
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-left .chat-shell {
      height: 100%;
      max-height: 100%;
      min-height: 0;
    }
    .mascot-panel {
      order: 1;
      width: 44%;
      min-width: 230px;
      max-width: 480px;
      flex-shrink: 0;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    /* บล็อบสีพาสเทลเบลอๆ ด้านหลังมาสคอต ให้ดูมีมิติ ไม่โล่ง */
    .mascot-panel::before,
    .mascot-panel::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(40px);
      pointer-events: none;
      z-index: 0;
    }
    .mascot-panel::before {
      width: 60%;
      aspect-ratio: 1;
      top: 8%;
      left: 8%;
      background: radial-gradient(circle, rgba(125,211,252,.55) 0%, transparent 70%);
    }
    .mascot-panel::after {
      width: 50%;
      aspect-ratio: 1;
      bottom: 10%;
      right: 10%;
      background:
        radial-gradient(circle at 30% 30%, rgba(253,164,175,.45) 0%, transparent 45%),
        radial-gradient(circle at 70% 70%, rgba(167,243,208,.50) 0%, transparent 60%),
        radial-gradient(circle at 60% 20%, rgba(253,224,71,.35) 0%, transparent 45%);
    }
    .mascot-group {
      position: relative;
      z-index: 1;
      width: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .mascot {
      width: 92%;
      max-width: 400px;
      height: auto;
      animation: floaty 3.5s ease-in-out infinite;
    }
    @keyframes floaty {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-14px); }
    }
    /* ไอคอนลอยรอบๆ มาสคอต — เกี่ยวกับการออกแบบ/เทคโนโลยี */
    .float-icon {
      position: absolute;
      z-index: 2;
      filter: drop-shadow(0 4px 10px rgba(96,165,250,.25));
      animation: float-icon 4.5s ease-in-out infinite;
    }
    .float-icon.fi-1 { top: 8%;  left: 6%;  width: 46px; animation-duration: 5s; }
    .float-icon.fi-2 { top: 14%; right: 8%; width: 38px; animation-duration: 4s; animation-delay: .6s; }
    .float-icon.fi-3 { bottom: 14%; left: 4%; width: 42px; animation-duration: 5.5s; animation-delay: 1.1s; }
    .float-icon.fi-4 { bottom: 6%; right: 10%; width: 40px; animation-duration: 4.8s; animation-delay: .3s; }
    @keyframes float-icon {
      0%,100% { transform: translateY(0) rotate(0deg); }
      50%     { transform: translateY(-12px) rotate(8deg); }
    }
    @media (max-width: 768px) {
      .mascot-panel::before, .mascot-panel::after,
      .float-icon { display: none; }
    }

    /* === composer area === */
    .composer {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      padding: 1.4rem 1rem 0.85rem;
      border-top: 1.5px solid #bfdbfe;
      background: linear-gradient(180deg, #f0f9ff 0%, #ffffff 100%);
      box-shadow: 0 -4px 10px -6px rgba(96,165,250,.30);
      position: relative;
      z-index: 2;
    }
    .composer-label {
      font-size: .8rem;
      font-weight: 500;
      color: #4a6fa5;
      margin-top: .35rem;
    }
    /* textarea บน, ปุ่มมุมขวาล่าง */
    .composer-row {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    .composer textarea {
      flex: 1;
      border-radius: 12px;
      border: 1.5px solid #bfdbfe;
      padding: 0.7rem 0.9rem;
      font-size: 1rem;
      font-weight: 300;
      line-height: 1.55;
      resize: none;
      font-family: inherit;
      background: #f8fbff;
      color: #1e3a5f;
      box-shadow: inset 0 2px 6px rgba(96,165,250,.12);
      transition: border-color .2s, box-shadow .2s;
    }
    .composer textarea:focus {
      outline: none;
      border-color: #60a5fa;
      background: #fff;
      box-shadow: none;
    }
    .composer textarea::placeholder { color: #93b4d4; }
    .composer-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: .55rem;
    }
    .composer-actions button {
      background: linear-gradient(135deg, #60a5fa 0%, #818cf8 100%);
      color: white;
      border: none;
      padding: 0.6rem 1.3rem;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity .2s, transform .15s, box-shadow .2s;
      font-family: inherit;
      box-shadow: 0 4px 12px rgba(96,165,250,.38);
    }
    .composer-actions button:hover {
      opacity: .9;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(96,165,250,.45);
    }
    .composer-actions button:active { transform: translateY(0); }

    /* === message bubbles (override) === */
    .message.user .bubble {
      background: linear-gradient(135deg, #60a5fa 0%, #818cf8 100%);
      color: #fff;
      box-shadow: 0 4px 14px rgba(96,165,250,.30);
    }
    .message.assistant .bubble {
      background: linear-gradient(135deg, #f0f9ff 0%, #ecfdf5 100%);
      border: 1.5px solid #bae6fd;
      border-left: 4px solid #7dd3fc;
      color: #1e3a5f;
      box-shadow: 0 2px 8px rgba(186,230,253,.40);
    }

    /* === chat header (status bar) === */
    .chat-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      padding: .45rem 1rem;
      background: linear-gradient(90deg, #eff6ff 0%, #f0fdfa 60%, #fdf2f8 100%);
      border-bottom: 1.5px solid #bfdbfe;
      box-shadow: 0 4px 10px -6px rgba(96,165,250,.35);
      position: relative;
      z-index: 2;
      font-size: .78rem;
      color: #4a6fa5;
      font-weight: 400;
      flex-wrap: wrap;
    }
    .chat-header-left {
      display: flex;
      align-items: center;
      gap: .4rem;
    }
    .chat-status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 0 3px rgba(52,211,153,.25);
      flex-shrink: 0;
      animation: pulse-dot 2s infinite;
    }
    @keyframes pulse-dot {
      0%,100% { box-shadow: 0 0 0 3px rgba(52,211,153,.25); }
      50%      { box-shadow: 0 0 0 5px rgba(52,211,153,.08); }
    }
    .chat-header-docs {
      display: flex;
      align-items: center;
      gap: .35rem;
      font-size: .76rem;
      color: #4a6fa5;
    }
    /* docs list ที่ app.js inject — ซ่อนไว้ แสดงแค่ count */
    #documents { display: none; }

    /* === ปุ่มประเมิน (อยู่ข้างปุ่มส่งคำถาม) === */
    .eval-link {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      font-size: 1rem;
      font-weight: 500;
      color: #92400e;
      background: linear-gradient(135deg, #fef9c3 0%, #fde68a 100%);
      border: 1.5px solid #fcd34d;
      border-radius: 12px;
      padding: 0.6rem 1.1rem;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 4px 12px rgba(251,191,36,.28);
      transition: opacity .2s, transform .15s, box-shadow .2s;
    }
    .eval-link:hover {
      opacity: .9;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(251,191,36,.38);
    }
    .eval-link:active { transform: translateY(0); }

    /* === startup alert === */
    .alert-popup {
      position: fixed;
      top: 20px;
      right: 20px;
      background: linear-gradient(135deg, #60a5fa, #818cf8);
      color: white;
      padding: 0.85rem 1.4rem;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(96,165,250,.40);
      font-size: 1rem;
      font-weight: 400;
      z-index: 9999;
      opacity: 0;
      transform: translateY(-20px);
      transition: all 0.5s ease;
    }
    .alert-popup.show { opacity: 1; transform: translateY(0); }

    /* === tablet === */
    @media (min-width: 769px) and (max-width: 1024px) {
      .page-title h1 { font-size: 1.85rem; }
      .page-title .subtitle { font-size: .95rem; }
      .mascot-panel { width: 36%; min-width: 180px; }
    }

    /* === short / landscape screens — ลดพื้นที่หัวข้อให้เหลือพื้นที่แชทมากขึ้น === */
    @media (max-height: 640px) {
      .page-title { padding: .45rem .8rem .5rem; margin: .4rem .8rem .3rem; }
      .page-title h1 { font-size: 1.4rem; margin-bottom: .15rem; }
      .page-title .subtitle { font-size: .8rem; }
      .content-row { padding: .4rem 1rem .6rem; }
    }

    /* === mobile === */
    @media (max-width: 768px) {
      .content-row {
        flex-direction: column-reverse;
        padding: 0 .6rem .6rem;
        gap: .5rem;
      }
      .mascot-panel {
        width: 100%;
        max-width: none;
        height: 90px;
        flex-shrink: 0;
      }
      .mascot {
        width: auto;
        height: 80px;
        max-width: none;
      }
      .chat-left {
        flex: 1;
        min-height: 0;
      }

      .page-title {
        padding: .55rem .7rem .65rem;
        margin-bottom: .55rem;
        border-radius: 12px;
      }
      .page-title h1 { font-size: 1.05rem; line-height: 1.4; }
      .page-title .subtitle { font-size: .8rem; }

      .composer-actions { justify-content: stretch; gap: .45rem; }
      .composer-actions button,
      .composer-actions .eval-link,
      .composer-actions .quiz-btn { flex: 1; text-align: center; justify-content: center; font-size: .95rem; padding: 0.72rem; margin-right: 0; }
    }

    /* === มือถือแนวนอน / จอเตี้ยมาก === */
    @media (max-width: 768px) and (max-height: 480px) {
      .mascot-panel { height: 56px; }
      .mascot { height: 48px; }
      .page-title { display: none; }
      .composer { padding: .5rem .85rem .6rem; }
      .composer-label { display: none; }
    }
  </style>
</head>
<body>
  <main class="layout">
    <!-- ── หัวข้อใหญ่ บนสุด ── -->
    <div class="page-title">
      <!-- ไอคอนตกแต่งมุม -->
      <svg class="title-deco td-1" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="24" cy="24" r="8" fill="none" stroke="#fde047" stroke-width="3.5" opacity=".95"/>
        <g fill="#fde047" opacity=".95">
          <rect x="21" y="1"  width="6" height="8" rx="2"/>
          <rect x="21" y="39" width="6" height="8" rx="2"/>
          <rect x="1"  y="21" width="8" height="6" rx="2"/>
          <rect x="39" y="21" width="8" height="6" rx="2"/>
          <rect x="5" y="5"   width="6" height="8" rx="2" transform="rotate(45 8 9)"/>
          <rect x="37" y="35" width="6" height="8" rx="2" transform="rotate(45 40 39)"/>
          <rect x="5" y="35"  width="6" height="8" rx="2" transform="rotate(-45 8 39)"/>
          <rect x="37" y="5"  width="6" height="8" rx="2" transform="rotate(-45 40 9)"/>
        </g>
      </svg>
      <svg class="title-deco td-2" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M24 4c-7.7 0-14 6.3-14 14 0 5.4 3 9 6 12.3.9 1 1.4 2.2 1.4 3.5V36h13.2v-2.2c0-1.3.5-2.5 1.4-3.5 3-3.3 6-6.9 6-12.3 0-7.7-6.3-14-14-14z" fill="#fef08a" stroke="#fde047" stroke-width="1.5"/>
        <rect x="18" y="40" width="12" height="4" rx="2" fill="#fda4af"/>
        <rect x="19" y="45" width="10" height="2.5" rx="1.25" fill="#fda4af" opacity=".8"/>
      </svg>
      <svg class="title-deco td-3" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="4" y="18" width="40" height="12" rx="3" fill="#a7f3d0" opacity=".95" transform="rotate(-18 24 24)"/>
        <g fill="#0d9488" opacity=".9" transform="rotate(-18 24 24)">
          <rect x="8"  y="18" width="3" height="6"/>
          <rect x="14" y="18" width="3" height="9"/>
          <rect x="20" y="18" width="3" height="6"/>
          <rect x="26" y="18" width="3" height="9"/>
          <rect x="32" y="18" width="3" height="6"/>
        </g>
      </svg>
      <div class="title-text">
        <h1>Teaching Assistant for Design &amp; Technology</h1>
        <p class="subtitle">ถาม-ตอบ เรื่องการออกแบบและเทคโนโลยี ชั้นมัธยมศึกษาปีที่ 4</p>
      </div>
    </div>

    <div class="content-row">
      <!-- ── ซ้าย: กล่องแชททั้งหมด ── -->
      <div class="chat-left">
    <section class="chat-shell">
      <!-- ── Status Bar ── -->
      <div class="chat-header">
        <div class="chat-header-left">
          <span class="chat-status-dot"></span>
          <span id="health">กำลังเชื่อมต่อ...</span>
        </div>
        <div class="chat-header-docs">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 14" width="12" height="12" aria-hidden="true" style="vertical-align:middle"><rect x="1" y="1" width="12" height="12" rx="2" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/><rect x="1" y="1" width="2.5" height="12" rx="1" fill="#3b82f6"/><line x1="5" y1="4.5" x2="11" y2="4.5" stroke="#bfdbfe" stroke-width="1" stroke-linecap="round"/><line x1="5" y1="7" x2="11" y2="7" stroke="#bfdbfe" stroke-width="1" stroke-linecap="round"/><line x1="5" y1="9.5" x2="9" y2="9.5" stroke="#bfdbfe" stroke-width="1" stroke-linecap="round"/></svg>
          <span id="doc-count">โหลดเอกสาร...</span>
        </div>
      </div>
      <ul id="documents" aria-hidden="true"></ul>

      <div id="messages" class="messages">
        <article class="message assistant">
          <div class="message-role"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="22" height="22" aria-hidden="true" style="vertical-align:middle;margin-right:5px;flex-shrink:0"><line x1="14" y1="1.5" x2="14" y2="5.5" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/><circle cx="14" cy="1.2" r="1.8" fill="#60a5fa"/><rect x="4" y="5.5" width="20" height="14" rx="5" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/><circle cx="10" cy="12" r="2.6" fill="#3b82f6"/><circle cx="18" cy="12" r="2.6" fill="#3b82f6"/><circle cx="10.9" cy="11.1" r="1" fill="white"/><circle cx="18.9" cy="11.1" r="1" fill="white"/><path d="M10 15.5 Q14 18.5 18 15.5" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round" fill="none"/><rect x="1" y="9" width="3" height="5.5" rx="1.5" fill="#bfdbfe"/><rect x="24" y="9" width="3" height="5.5" rx="1.5" fill="#bfdbfe"/></svg> ผู้ช่วยสอน</div>
          <div class="bubble">สวัสดีค่ะ ฉันคือผู้ช่วยตอบคำถามวิชาเทคโนโลยีและการออกแบบ📒</div>
        </article>
      </div>

      <form id="chat-form" class="composer">

  <script>
    const form = document.getElementById('chat-form');
    const textarea = document.getElementById('question');
    textarea.addEventListener('keydown', function (event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });
    window.addEventListener('load', () => {
      const alertBox = document.getElementById('startup-alert');
      alertBox.classList.add('show');
      setTimeout(() => alertBox.classList.remove('show'), 5000);
    });

    /* ── ล็อกความสูงหน้าจอจริง (กัน address bar มือถือ / dvh ไม่รองรับ) ── */
    function setAppHeight() {
      document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
    }
    setAppHeight();
    window.addEventListener('resize', setAppHeight);
    window.addEventListener('orientationchange', setAppHeight);
  </script>
