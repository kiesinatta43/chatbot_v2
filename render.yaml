services:
  - type: web
    name: design-tech-chatbot
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python -m app.ingest"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: CHAT_BACKEND
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: PYTHON_VERSION
        value: 3.11.9
